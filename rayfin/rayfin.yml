id: governly
name: governly
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://palm-bay-9b5226fc87-northeurope.webapp.fabricapps.net
      - https://warm-bluff-0559ee15f4-northeurope.webapp.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  functions:
    enabled: false
  storage:
    enabled: false
